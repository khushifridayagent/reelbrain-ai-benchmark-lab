name: Isolated baseline and provider smoke
on:
  push:
    paths:
      - '.github/workflows/lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: khushifridayagent/reelbrain-knowledge-engine
          ref: 6b83a59ca82bed4316c166f20feb628a434f5549
          persist-credentials: false
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baseline offline tests
        working-directory: baseline
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_contract.py tests/test_keyframes.py tests/test_media_evidence_summary.py tests/test_model_quota_retry.py
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test synthetic text connectivity only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import os, json, urllib.request, urllib.error, time
          def call(name,url,key,body,header):
              if not key:
                  print(name, 'MISSING_SECRET'); return False
              start=time.monotonic()
              try:
                  req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Content-Type':'application/json','User-Agent':'reelbrain-lab/1.0','Accept':'application/json',**header})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      data=json.load(r)
                  print(name,'HTTP 200',round(time.monotonic()-start,2),'seconds')
                  if name=='Gemini':
                      result=data['candidates'][0]['content']['parts'][0]['text']
                  else:
                      result=data['choices'][0]['message']['content']
                  ok='RB-731' in result
                  print(name,'sentinel_correct',ok)
                  return ok
              except urllib.error.HTTPError as e:
                  print(name,'HTTP',e.code); return False
              except Exception as e:
                  print(name,type(e).__name__); return False
          prompt='Return exactly RB-731.'
          g=os.environ.get('GEMINI_API_KEY','')
          q=os.environ.get('GROQ_API_KEY','').strip()
          if q and not q.startswith('gsk_'):
              print('Groq credential format mismatch'); q=''
          a=call('Gemini','https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent',g,{'contents':[{'parts':[{'text':prompt}]}]},{'x-goog-api-key':g})
          b=call('Groq','https://api.groq.com/openai/v1/chat/completions',q,{'model':'openai/gpt-oss-20b','messages':[{'role':'user','content':prompt}]},{'Authorization':'Bearer '+q})
          raise SystemExit(0 if a and b else 1)
          PY
