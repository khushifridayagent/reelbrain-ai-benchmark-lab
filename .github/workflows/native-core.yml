name: Native intelligence core tests
on:
  push:
    paths: ['native_intelligence/**','.github/workflows/native-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 opencv-python-headless==4.12.0.88 requests==2.32.5
      - run: python -m unittest discover -s native_intelligence/tests -v
