name: Pause-level native frame audit
on:
  push:
    paths: ['.github/workflows/pause-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet yt-dlp gallery-dl instaloader opencv-python-headless pillow requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: python -u pause_audit.py
